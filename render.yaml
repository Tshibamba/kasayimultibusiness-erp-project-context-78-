services:
  - type: web
    name: kasayi-erp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kasayi-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: kasayi-db
    plan: free
    ipAllowList: []
